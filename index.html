<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Verification Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #08090e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
    }

    .header {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #292a35;
      position: relative;
    }

    .header h1 {
      font-size: 23px;
      letter-spacing: 1px;
      color: #ac9ef3;
      font-weight: 700;
    }

    .back {
      position: absolute;
      left: 38px;
      font-size: 38px;
      color: #ffffff;
      font-weight: 300;
    }

    .hero {
      text-align: center;
      padding: 72px 20px 42px;
    }

    .shield {
      width: 150px;
      height: 150px;
      margin: 0 auto 58px;
      border-radius: 50%;
      border: 2px solid rgba(172, 158, 243, 0.55);
      background: rgba(172, 158, 243, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 55px rgba(172, 158, 243, 0.12);
    }

    .check {
      color: #ac9ef3;
      font-size: 82px;
      font-weight: 300;
      line-height: 1;
    }

    .hero h2 {
      font-size: 42px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .purple {
      color: #ac9ef3;
    }

    .subtitle {
      color: #b5b5bf;
      font-size: 20px;
      font-weight: 400;
    }

    .container {
      width: min(92%, 720px);
      margin: 0 auto;
      padding-bottom: 50px;
    }

    .card {
      background: #101117;
      border: 1px solid #292b37;
      border-radius: 24px;
      padding: 30px;
      margin-top: 22px;
    }

    .card-title {
      font-size: 20px;
      margin-bottom: 22px;
      color: #ffffff;
    }

    .address-box {
      border: 1px solid #343541;
      border-radius: 16px;
      padding: 22px;
      background: #0c0d12;
    }

    .address {
      color: #ac9ef3;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-all;
      text-align: center;
    }

    .copy-button {
      width: 100%;
      margin-top: 20px;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #ac9ef3;
      color: #08090e;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .copy-button:active {
      transform: scale(0.98);
    }

    .footer {
      text-align: center;
      color: #777985;
      font-size: 12px;
      letter-spacing: 1.5px;
      padding: 10px 0 35px;
    }

    @media (max-width: 500px) {
      .hero h2 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 18px;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="back">‹</div>
    <h1>VERIFICATION PAGE</h1>
  </header>

  <section class="hero">

    <div class="shield">
      <div class="check">✓</div>
    </div>

    <h2>
      Secure <span class="purple">Verification</span>
    </h2>

    <p class="subtitle">
      Secure Verification
    </p>

  </section>

  <main class="container">

    <div class="card">

      <div class="card-title">
        Verification Address
      </div>

      <div class="address-box">

        <div id="verificationAddress" class="address">
      bc1qwcklty2l6waeqqu6xnqkdlstlkr4lsax4rlp0e5sjz74fzkht4zqqf7yd9
        </div>

      </div>

      <button
        id="copyAddress"
        class="copy-button"
      >
        Copy Address
      </button>

    </div>

    <div class="footer">
      SECURE VERIFICATION
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
